<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGSA - Colégio Victorino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <!-- Link para Icons do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Link Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body>

    <div class="container-banner bg-primary">
        <header class="d-flex justify-content-around align-items-center">
            <i class="fa-solid fa-angle-left text-high"></i>
            <figcaption>
                <img src="assets/images/image-exemplo.png" alt="Imagem de Perfil" class="ms-3">
                <i class="fa-solid fa-camera text-dark icon-camera"></i>
            </figcaption>
            <a href="password-changed.html" class="text-light text-high">
                Salvar
            </a>
        </header>
        <form class="d-flex flex-column mt-3">
            <label class="fw-bold" for="nome-completo">Nome completo</label>
            <input id="nome-completo" type="text" placeholder="André Ricardo">
            <label class="fw-bold" for="usuário">Uusário</label>
            <input id="usuário" type="text" placeholder="al.ricardo">
            <label class="fw-bold" for="telefone">Telefone</label>
            <input id="telefone" type="tel" placeholder="(11) 98765-4321">
            <label class="fw-bold" for="email">Email</label>
            <input id="email" type="email" placeholder="al.andrericardo@colegiovictorino.com.br">
            <label class="fw-bold" for="data-nascimento">Data de Nascimento</label>
            <input id="data-nascimento" type="date">

            <a href="new-password.html" class="text-center mt-5">
                Alterar Senha
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
